<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RiskPlus · Decisão de crédito B2B em segundos</title>
  <meta name="description" content="Saiba em segundos se vale vender a prazo. Cole o CNPJ do seu cliente B2B e a RiskPlus responde, mesmo quando a empresa não tem histórico no bureau." />
  <meta property="og:title" content="RiskPlus · Decisão de crédito B2B em segundos" />
  <meta property="og:description" content="Saiba em segundos se vale vender a prazo. Cole o CNPJ do seu cliente B2B." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="assets/icon-blue.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Outfit:wght@600;800&family=Open+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />

  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.js"></script>

  <style>
    /* ============================================================
       RiskPlus Design System tokens (project/styles/tokens.css,
       "Guia de Estilo - Risk Plus v1"), laid out in an apple.com-style
       tile system.
       Shape rule (DS radii): buttons & inputs = --radius-md (12px),
       chips = pill, inner cards = --radius-lg (20px),
       tiles = --radius-xl (28px).
       ============================================================ */
    :root {
      /* Primary / secondary */
      --rp-blue:   #0050FF;
      --rp-white:  #FFFFFF;
      --rp-orange: #FF6E29;
      --rp-purple: #6E56CF;
      --rp-blue-50: #EAF1FF;  --rp-blue-100: #CFDEFF; --rp-blue-200: #9DBDFF;
      --rp-blue-300: #5C8EFF; --rp-blue-400: #2A6BFF; --rp-blue-600: #003ECC;
      --rp-blue-700: #002E99; --rp-blue-800: #001F66; --rp-blue-900: #001233;
      --rp-orange-50: #FFF1E9; --rp-orange-100: #FFD9C2; --rp-orange-300: #FFA170;
      --rp-orange-600: #E45713; --rp-orange-700: #B7430A;
      /* Neutrals (Grafite azulado) */
      --rp-ink: #0B0F18; --rp-graphite: #1B2230;
      --rp-slate-700: #3A4252; --rp-slate-600: #5B6475; --rp-slate-500: #7B8493;
      --rp-slate-400: #A0A8B5; --rp-slate-300: #C4CAD3; --rp-slate-200: #DFE2E8;
      --rp-slate-100: #EEF0F4; --rp-slate-50: #F7F8FA;
      /* Risk decision palette */
      --risk-go: #1E9E5E;   --risk-go-soft: #E3F6EC;
      --risk-caution: #FF6E29; --risk-caution-soft: #FFF1E9;
      --risk-stop: #D6324A; --risk-stop-soft: #FBE6EA;

      /* Type */
      --font-display: 'Momo Trust Display', 'Outfit', system-ui, sans-serif;
      --font-body:    'Open Sans', system-ui, -apple-system, sans-serif;
      --font-mono:    ui-monospace, 'SFMono-Regular', Menlo, monospace;

      /* Radii, shadows, motion */
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --radius-xl: 28px; --radius-pill: 999px;
      --shadow-sm: 0 1px 3px rgba(11,15,24,.06), 0 1px 2px rgba(11,15,24,.04);
      --shadow-md: 0 4px 12px rgba(11,15,24,.08), 0 2px 4px rgba(11,15,24,.04);
      --shadow-lg: 0 12px 32px rgba(11,15,24,.10), 0 4px 8px rgba(11,15,24,.04);
      --shadow-brand: 0 12px 32px rgba(0,80,255,.22), 0 4px 12px rgba(0,80,255,.12);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --gradient-cover: linear-gradient(135deg, #1a5bff 0%, #0050FF 60%, #002cb8 100%);

      /* Semantic aliases used by this page */
      --page:   var(--rp-white);
      --tile:   var(--rp-slate-50);
      --raised: var(--rp-white);
      --ink:    var(--rp-ink);
      --ink-2:  var(--rp-slate-700);
      --muted:  var(--rp-slate-600);
      --faint:  var(--rp-slate-400);
      --line:   var(--rp-slate-200);
      --hair:   rgba(11,15,24,.08);
      --accent:      var(--rp-blue);
      --accent-hov:  var(--rp-blue-600);
      --accent-soft: var(--rp-blue-50);
      --on-accent:   var(--rp-white);
      --warn:        var(--rp-orange);
      --warn-hov:    var(--rp-orange-600);
      --dark:     var(--rp-ink);
      --dark-2:   var(--rp-graphite);
      --dark-ink: var(--rp-white);
      --dark-mut: var(--rp-slate-400);
      --go: var(--risk-go);           --go-soft: var(--risk-go-soft);
      --caution: var(--rp-orange-700); --caution-soft: var(--risk-caution-soft);
      --stop: var(--risk-stop);       --stop-soft: var(--risk-stop-soft);

      --font: var(--font-body);
      --mono: var(--font-mono);
      --ease: var(--ease-out);
      --r-tile: var(--radius-xl); --r-card: var(--radius-lg); --r-input: var(--radius-md);
      --z-nav: 40; --z-menu: 50;
      --nav-h: 76px;
    }
    /* Dark scheme built from the DS neutrals (the guide defines light only) */
    @media (prefers-color-scheme: dark) {
      :root {
        --page:  var(--rp-ink);
        --tile:  #111623;
        --raised: var(--rp-graphite);
        --ink:   var(--rp-slate-50);
        --ink-2: var(--rp-slate-200);
        --muted: var(--rp-slate-400);
        --faint: var(--rp-slate-600);
        --line:  var(--rp-slate-700);
        --hair:  rgba(255,255,255,.1);
        --accent:      var(--rp-blue-400);
        --accent-hov:  var(--rp-blue-300);
        --accent-soft: var(--rp-blue-900);
        --dark:   #05070C;
        --dark-2: var(--rp-graphite);
        --go: #4FCB8B; --go-soft: #0F2A1E;
        --caution: var(--rp-orange-300); --caution-soft: #2E1A0F;
        --stop: #F07587; --stop-soft: #2E1218;
      }
      .logo-light { display: none !important; }
      .logo-dark { display: block !important; }
    }
    .logo-dark { display: none !important; }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    section[id] { scroll-margin-top: var(--nav-h); }
    body { font-family: var(--font); font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: -.02em; text-wrap: balance; }
    /* Display face for big numerals and headline-like labels */
    .res-score, .res-arch, .stat .big, .pmetrics .v, .bt .share b, .bt .letter, .model .tier, .model .price b, .mmenu nav a { font-family: var(--font-display); font-weight: 400; }
    p { margin: 0; text-wrap: pretty; }
    .num { font-variant-numeric: tabular-nums; }
    .skip { position: absolute; left: 16px; top: -60px; background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 999px; z-index: 100; }
    .skip:focus { top: 12px; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
    .wrap-narrow { max-width: 820px; margin: 0 auto; padding: 0 24px; }
    .center { text-align: center; }

    /* Reveal ------------------------------------------------------ */
    [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity 1s var(--ease), transform 1s var(--ease); transition-delay: calc(var(--i, 0) * 90ms); }
    [data-reveal][data-shown] { opacity: 1; transform: none; }

    /* Buttons (pill) ------------------------------------------------ */
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-md); padding: 13px 22px; font-size: 15px; font-weight: 600; line-height: 1.2; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .2s var(--ease); }
    .pill:active { transform: scale(.97); }
    .pill-fill { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-brand); }
    .pill-fill:hover { background: var(--accent-hov); }
    .pill-line { color: var(--accent); border-color: var(--accent); }
    .pill-line:hover { background: var(--accent); color: var(--on-accent); }
    .pill-sm { padding: 9px 16px; font-size: 14px; }
    .pill-warn { background: var(--warn); color: #fff; box-shadow: 0 8px 20px rgba(255,110,41,.30); }
    .pill-warn:hover { background: var(--warn-hov); }
    .more { color: var(--accent); display: inline-flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 600; }
    .more i { font-size: 14px; transition: transform .3s var(--ease); }
    .more:hover { text-decoration: underline; }
    .more:hover i { transform: translateX(3px); }

    /* Global nav ---------------------------------------------------- */
    .gnav { position: sticky; top: 0; z-index: var(--z-nav); height: var(--nav-h); background: color-mix(in srgb, var(--page) 80%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
    .gnav .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .gnav .logo img { height: 48px; display: block; }
    .gnav nav { display: flex; gap: 32px; }
    .gnav nav a { font-size: 14px; font-weight: 500; color: var(--ink-2); opacity: .85; transition: opacity .2s, color .2s; }
    .gnav nav a:hover, .gnav nav a.active { opacity: 1; color: var(--ink); }
    .gnav .right { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 36px; height: 36px; display: none; place-items: center; border: 0; background: none; cursor: pointer; font-size: 20px; color: var(--ink); }

    .mmenu { position: fixed; inset: 0; z-index: var(--z-menu); background: var(--page); padding: 0 32px 32px; display: flex; flex-direction: column; visibility: hidden; opacity: 0; transition: opacity .3s var(--ease), visibility 0s .3s; }
    .mmenu.open { visibility: visible; opacity: 1; transition: opacity .3s var(--ease); }
    .mmenu .top { height: var(--nav-h); display: flex; justify-content: flex-end; align-items: center; }
    .mmenu .top .icon-btn { display: grid; }
    .mmenu nav { display: grid; gap: 4px; margin-top: 20px; }
    .mmenu nav a { font-size: 28px; letter-spacing: -.02em; padding: 6px 0; opacity: 0; transform: translateY(-8px); transition: opacity .5s var(--ease), transform .5s var(--ease); transition-delay: calc(var(--i) * 40ms + 80ms); }
    .mmenu.open nav a { opacity: 1; transform: none; }
    .mmenu .pill { margin-top: auto; }

    /* Type & tiles -------------------------------------------------- */
    .tile { background: var(--tile); }
    .sec { padding: 120px 0; }
    .h-xl { font-size: clamp(40px, 6vw, 72px); line-height: 1.05; letter-spacing: -.03em; }
    .h-lg { font-size: clamp(32px, 4.4vw, 56px); line-height: 1.06; letter-spacing: -.025em; }
    .lead { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.55; color: var(--muted); font-weight: 400; }
    .sub-c { margin-top: 18px; max-width: 30em; margin-inline: auto; }
    .actions { display: flex; gap: 22px; align-items: center; justify-content: center; flex-wrap: wrap; }

    /* Hero: demo left, text right. On wide screens the hero pins and the
       pieces travel from a centered stack into the two-column layout. */
    .hero { position: relative; }
    .hero-pin { position: relative; padding: 80px 0 96px; }
    .hero-grid { max-width: 1200px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 72px; align-items: center; }
    .hero-text { grid-column: 2; grid-row: 1; }
    .hero-demo { grid-column: 1; grid-row: 1; }
    .hero .h-xl { font-size: clamp(40px, 4.2vw, 60px); margin: 0 0 20px; }
    .hero .h-xl .hl { color: var(--accent); }
    .hero .lead { margin: 0 0 30px; max-width: 26em; }
    .hero .actions { justify-content: flex-start; }
    .load { opacity: 0; transform: translateY(18px); animation: load-in 1.1s var(--ease) forwards; animation-delay: var(--d, 0ms); }
    @keyframes load-in { to { opacity: 1; transform: none; } }
    @supports (animation-timeline: scroll()) {
      @media (min-width: 1024px) and (prefers-reduced-motion: no-preference) {
        .hero { height: calc(100dvh - var(--nav-h) + 780px); }
        .hero-pin { position: sticky; top: var(--nav-h); height: calc(100dvh - var(--nav-h)); padding: 0; display: grid; align-items: center; overflow: hidden; }
        .hero-text, .hero-demo { animation: linear both; animation-timeline: scroll(root); animation-range: 40px 560px; }
        .hero-text { animation-name: hero-text-in; }
        .hero-demo { animation-name: hero-demo-in; }
        @keyframes hero-text-in { from { transform: translate(var(--tx, 0px), var(--ty, 0px)); } to { transform: none; } }
        @keyframes hero-demo-in { from { transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(.96); } to { transform: none; } }
      }
    }

    /* Demo (the real product component) */
    .demo { background: var(--raised); border-radius: var(--r-tile); padding: 28px 28px 32px; box-shadow: 0 0 0 1px var(--hair), 0 30px 80px -30px rgba(0,40,120,.25); text-align: left; }
    .demo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
    .demo-head .ok { display: inline-flex; align-items: center; gap: 6px; color: var(--go); }
    .demo-row { display: flex; gap: 8px; background: var(--tile); border-radius: 14px; padding: 6px; border: 1px solid transparent; transition: border-color .25s var(--ease), box-shadow .25s var(--ease); }
    .demo-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .demo-row input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: var(--mono); font-size: 16px; padding: 8px 14px; color: var(--ink); }
    .demo-row button { border: 0; border-radius: var(--radius-sm); font-weight: 600; background: var(--accent); color: var(--on-accent); font-size: 15px; padding: 0 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .2s var(--ease), transform .2s var(--ease); }
    .demo-row button:hover { background: var(--accent-hov); }
    .demo-row button:active { transform: scale(.96); }
    .demo-row button:disabled { opacity: .45; cursor: default; }
    .demo-ex { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
    .demo-ex button { font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; transition: border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease); }
    .demo-ex button:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
    .demo-ex button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
    .demo-ex button:disabled { opacity: .5; cursor: default; }
    .demo-stage { margin-top: 22px; min-height: 340px; }

    .skel { display: grid; gap: 12px; }
    .skel .row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--faint); transition: color .4s var(--ease); }
    .skel .row.active { color: var(--ink); }
    .skel .row.done { color: var(--muted); }
    .skel .row i { font-size: 16px; }
    .skel .row.done i { color: var(--go); }
    .skel .row.active i { color: var(--accent); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skel .bar { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--tile) 0%, var(--hair) 50%, var(--tile) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    .skel .bar.w1 { width: 72%; } .skel .bar.w2 { width: 48%; } .skel .bar.w3 { width: 86%; margin-top: 18px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .res { border-radius: var(--r-card); padding: 22px; opacity: 0; animation: load-in .7s var(--ease) forwards; }
    .res.go { background: var(--go-soft); } .res.caution { background: var(--caution-soft); } .res.stop { background: var(--stop-soft); }
    .res-top { display: flex; align-items: center; gap: 14px; }
    .res-av { width: 44px; height: 44px; border-radius: 12px; background: var(--raised); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; flex: none; }
    .res-co { font-weight: 600; font-size: 16px; line-height: 1.25; }
    .res-cnpj { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
    .res-score { display: none; font-size: 56px; line-height: .8; letter-spacing: -.03em; }
    .tone-go { color: var(--go); } .tone-caution { color: var(--caution); } .tone-stop { color: var(--stop); }
    .res-head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 18px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
    .res-k { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .res-decision { font-family: var(--font-display); font-size: 40px; line-height: 1; letter-spacing: -.02em; }
    .res-arch { font-size: 24px; letter-spacing: -.025em; margin-top: 18px; }
    .res-lbl { font-size: 14px; font-weight: 500; margin-top: 2px; }
    .traits { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
    .trait { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--raised); color: var(--ink-2); opacity: 0; animation: load-in .5s var(--ease) forwards; animation-delay: calc(var(--i) * 70ms + 180ms); }
    .trait i { font-size: 13px; }
    .trait.good i { color: var(--go); } .trait.neutral i { color: var(--caution); } .trait.bad i { color: var(--stop); }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; padding-top: 16px; border-top: 1px solid var(--hair); }
    .kv .k { font-size: 12px; color: var(--muted); }
    .kv .v { font-size: 15px; font-weight: 600; }

    /* Marquee (only one on the page) */
    .marquee { padding: 28px 0; overflow: hidden; border-bottom: 1px solid var(--hair); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .marquee .track { display: flex; gap: 48px; width: max-content; animation: slide 46s linear infinite; }
    .marquee span { font-size: 21px; font-weight: 600; letter-spacing: -.02em; color: var(--faint); white-space: nowrap; }
    @keyframes slide { to { transform: translateX(-50%); } }

    /* Scroll-lit statements */
    .lit-head { margin-bottom: 80px; }
    .lit-list { display: grid; gap: 56px; max-width: 900px; margin: 0 auto; }
    .lit { color: var(--line); transition: color .7s var(--ease); }
    .lit h3 { font-size: clamp(28px, 3.6vw, 48px); line-height: 1.1; letter-spacing: -.03em; }
    .lit h3 b { transition: color .7s var(--ease); }
    .lit p { margin-top: 12px; font-size: 17px; color: transparent; transition: color .7s var(--ease); }
    .lit[data-on] { color: var(--ink); }
    .lit[data-on] h3 b { color: var(--accent); }
    .lit[data-on] p { color: var(--muted); }

    /* Gallery */
    .gal-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
    .gal-nav { display: flex; gap: 10px; }
    .gal-nav button { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--line); color: var(--ink); cursor: pointer; display: grid; place-items: center; font-size: 16px; transition: opacity .2s, transform .2s var(--ease); }
    .gal-nav button:active:not(:disabled) { transform: scale(.94); }
    .gal-nav button:disabled { opacity: .35; cursor: default; }
    .gal { --pad: max(24px, calc((100vw - 1120px) / 2 + 24px)); display: grid; grid-auto-flow: column; grid-auto-columns: min(420px, 84vw); gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--pad); padding: 8px var(--pad) 24px; scrollbar-width: none; }
    .gal::-webkit-scrollbar { display: none; }
    .gcard { scroll-snap-align: start; border-radius: var(--r-tile); background: var(--raised); min-height: 520px; padding: 36px 32px; display: flex; flex-direction: column; transition: transform .5s var(--ease); }
    .gcard:hover { transform: scale(1.015); }
    .gcard.blue { background: var(--gradient-cover); color: #fff; box-shadow: var(--shadow-brand); }
    .gcard .step { font-size: 14px; font-weight: 600; color: var(--muted); }
    .gcard.blue .step { color: rgba(255,255,255,.75); }
    .gcard h3 { font-size: 30px; line-height: 1.1; letter-spacing: -.03em; margin-top: 8px; }
    .gtext { font-size: 17px; color: var(--muted); margin-top: 12px; }
    .gcard.blue .gtext { color: rgba(255,255,255,.85); }
    .gvis { margin-top: auto; padding-top: 32px; }
    .field-mock { background: var(--tile); border-radius: var(--radius-md); padding: 14px 20px; font-family: var(--mono); font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .field-mock .caret { width: 2px; height: 20px; background: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips span { font-size: 13px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); color: #fff; }
    .verdicts { display: grid; gap: 8px; }
    .verdicts span { border-radius: var(--radius-md); padding: 12px 18px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .verdicts .go { background: var(--go-soft); color: var(--go); }
    .verdicts .caution { background: var(--caution-soft); color: var(--caution); }

    /* Dark product tile (one deliberate color block) */
    .dark { background: var(--dark); color: var(--dark-ink); }

    .pcard { max-width: 860px; margin: 64px auto 0; background: var(--dark-2); border-radius: var(--r-tile); padding: 40px; }

    .pcard .who { font-size: 14px; color: var(--dark-mut); }

    .pcard .traits { margin: 28px 0 0; }
    .pcard .trait { background: rgba(255,255,255,.08); color: var(--dark-ink); opacity: 1; animation: none; }

    .pcard .badge { color: var(--dark-mut); background: rgba(255,255,255,.08); font-weight: 500; }
    .pfactors { display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; margin-top: 32px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.1); }
    .pfactors .k { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dark-mut); }
    .pfactors .traits { margin: 12px 0 0; }
    .pmetrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 36px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,.1); }
    .pmetrics .k { font-size: 14px; color: var(--dark-mut); }
    .pmetrics .v { font-size: clamp(40px, 5vw, 64px); letter-spacing: -.045em; line-height: 1; margin-top: 8px; }
    .pmetrics .v small { font-size: 17px; font-weight: 500; color: var(--dark-mut); letter-spacing: -.01em; margin-left: 4px; }
    .pmetrics .v.go { color: #7EE2A0; }
    .pmetrics .s { font-size: 13px; color: var(--dark-mut); margin-top: 6px; }

    /* Bento */
    .bento { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 64px; }
    .bt { border-radius: var(--r-tile); padding: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 340px; }
    .bt.big { grid-row: span 2; min-height: 700px; }
    .bt.go { background: var(--go-soft); } .bt.caution { background: var(--caution-soft); } .bt.stop { background: var(--stop-soft); }
    .bt .tag { font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
    .bt.go .tag, .bt.go .share b { color: var(--go); }
    .bt.caution .tag, .bt.caution .share b { color: var(--caution); }
    .bt.stop .tag, .bt.stop .share b { color: var(--stop); }
    .bt h3 { font-size: clamp(28px, 3vw, 40px); line-height: 1.08; letter-spacing: -.03em; margin-top: 10px; max-width: 12ch; position: relative; }
    .bt .bt-desc { font-size: 17px; color: var(--ink-2); margin-top: 12px; max-width: 26em; position: relative; }
    .bt .bt-k { margin-top: auto; padding-top: 28px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); position: relative; }
    .bt.go .tag { color: var(--go); } .bt.caution .tag { color: var(--caution); } .bt.stop .tag { color: var(--stop); }
    .bt ul { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; position: relative; }
    .bt li { font-size: 15px; color: var(--ink-2); }
    .bt .share { margin-top: auto; padding-top: 28px; font-size: 15px; color: var(--muted); position: relative; }
    .bt .share b { display: block; font-size: clamp(48px, 6vw, 80px); letter-spacing: -.03em; line-height: 1; }
    .bt .letter { position: absolute; right: -10px; bottom: -40px; font-size: 280px; letter-spacing: -.03em; line-height: 1; opacity: .07; pointer-events: none; transition: transform 1.2s var(--ease); }
    .bt.big .letter { font-size: 460px; bottom: -80px; }
    .bt:hover .letter { transform: translateY(-12px); }

    /* FAQ */
    .faq { margin-top: 56px; }
    .qa { border-bottom: 1px solid var(--line); }
    .qa button { width: 100%; background: none; border: 0; padding: 26px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; text-align: left; cursor: pointer; font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; }
    .qa button:hover span { color: var(--accent); }
    .qa button span { transition: color .2s var(--ease); }
    .qa button i { font-size: 18px; color: var(--muted); transition: transform .45s var(--ease); margin-top: 3px; flex: none; }
    .qa.open button i { transform: rotate(45deg); }
    .qa .a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
    .qa.open .a { grid-template-rows: 1fr; }
    .qa .a > div { overflow: hidden; }
    .qa .a p { padding: 0 48px 28px 0; color: var(--muted); }
    .faq-note { margin-top: 32px; color: var(--muted); text-align: center; }
    .faq-note a { color: var(--accent); }
    .faq-note a:hover { text-decoration: underline; }

    /* Access */
    .access { border-radius: var(--r-tile); background: var(--tile); padding: 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .access .lead { margin-top: 18px; }
    .perks { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
    .perks li { display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
    .perks i { color: var(--accent); font-size: 20px; }
    .form { background: var(--raised); border-radius: var(--r-card); padding: 32px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 14px; font-weight: 500; color: var(--ink-2); }
    .field label .opt { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .field input { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: var(--r-input); border: 1px solid var(--line); background: var(--raised); color: var(--ink); outline: none; transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .field.err input { border-color: var(--stop); }
    .field .msg { font-size: 13px; color: var(--stop); }
    .form .pill { width: 100%; margin-top: 8px; padding: 14px; }
    .form .fine { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }
    .done { text-align: center; padding: 48px 8px; animation: load-in .6s var(--ease); }
    .done i { font-size: 48px; color: var(--go); }
    .done h3 { font-size: 28px; margin: 14px 0 8px; }
    .done p { color: var(--muted); }

    /* Footer */
    .foot { background: var(--tile); font-size: 12px; color: var(--muted); padding: 40px 0 28px; }
    .foot .note { padding-bottom: 18px; border-bottom: 1px solid var(--line); line-height: 1.6; }
    .foot .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 24px 0; }
    .foot h4 { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 10px; letter-spacing: 0; }
    .foot .cols a { display: block; padding: 4px 0; }
    .foot a:hover { color: var(--ink); text-decoration: underline; }
    .foot .legal { padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .foot .legal nav { display: flex; gap: 18px; }

    /* Responsive ---------------------------------------------------- */
    @media (max-width: 1023px) {
      .hero-pin { padding: 64px 0 80px; }
      .hero-grid { grid-template-columns: 1fr; gap: 48px; max-width: 640px; padding: 0 20px; }
      .hero-text, .hero-demo { grid-column: 1; grid-row: auto; }
      .hero-text { text-align: center; }
      .hero .lead { margin-inline: auto; }
      .hero .actions { justify-content: center; }
    }
    @media (max-width: 1068px) {
      .access { grid-template-columns: 1fr; padding: 56px 40px; }
    }
    @media (max-width: 833px) {
      body { font-size: 16px; }
      .gnav nav, .gnav .right .pill { display: none; }
      .icon-btn { display: grid; }
      .sec { padding: 88px 0; }
      .demo { padding: 22px 18px 26px; }
      .demo-stage { min-height: 380px; }
      .lit-list { gap: 40px; }
      .gal-head { align-items: flex-start; flex-direction: column; }
      .gcard { min-height: 400px; padding: 30px 26px; }
      .pcard { padding: 28px 22px; }
      .pcard-top { flex-wrap: wrap; }
      .pcard .badge { margin-left: 0; }
      .pmetrics { grid-template-columns: 1fr; gap: 28px; }
      .bento { grid-template-columns: 1fr; }
      .bt.big { grid-row: auto; min-height: 420px; }
      .bt.big .letter { font-size: 300px; bottom: -50px; }
      .bt { padding: 32px 28px; }
      .stats, .compare { grid-template-columns: 1fr; gap: 56px; }
      .model .name { min-height: 0; }
      .access { padding: 40px 22px; }
      .form { padding: 22px; }
      .foot .cols { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      :root { --nav-h: 64px; }
      .gnav .logo img { height: 40px; }
      .wrap, .wrap-narrow { padding: 0 16px; }
      .demo-head .ok { display: none; }
      .demo-row { flex-direction: column; }
      .demo-row button { height: 44px; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
      html { scroll-behavior: auto; }
      [data-reveal], .load, .res, .trait { opacity: 1 !important; transform: none !important; }
      .marquee .track { animation: none; }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip">Pular para o conteúdo</a>
  <div id="root"></div>

  <script type="text/babel">
    // ── Data ──────────────────────────────────────────────────────────────────
    const SAMPLES = {
      "12.345.678/0001-90": {
        name: "Mercatto Distribuição Ltda", setor: "Atacado · Alimentos", fundacao: "2014",
        initials: "MD", decision: "Liberar", band: "go",
        traits: [
          { kind: "good", text: "Pagamentos em dia", icon: "check-circle" },
          { kind: "good", text: "Faturamento estável", icon: "trend-up" },
          { kind: "good", text: "Sócios sem restrições", icon: "shield-check" },
          { kind: "good", text: "10 anos de Receita ativa", icon: "calendar-blank" },
        ]
      },
      "33.222.111/0001-44": {
        name: "Vega Indústria & Comércio", setor: "Indústria · Têxtil", fundacao: "2019",
        initials: "VI", decision: "Atenção", band: "caution",
        traits: [
          { kind: "good", text: "Cadastro regular na Receita", icon: "check-circle" },
          { kind: "neutral", text: "Atrasos recentes em pagamentos", icon: "clock" },
          { kind: "neutral", text: "Faturamento oscilando", icon: "trend-down" },
          { kind: "good", text: "5 anos de Receita ativa", icon: "calendar-blank" },
        ]
      },
      "55.999.444/0001-12": {
        name: "Northbay Trading ME", setor: "Importação", fundacao: "2023",
        initials: "NT", decision: "Negar", band: "stop",
        traits: [
          { kind: "bad", text: "Empresa recém-aberta", icon: "warning-circle" },
          { kind: "bad", text: "Sócio com restrições em outros CNPJs", icon: "user-minus" },
          { kind: "bad", text: "Cadastro inconsistente na Receita", icon: "x-circle" },
        ]
      }
    };
    const FALLBACK = {
      name: "Empresa consultada", setor: "Não informado", fundacao: "Não informado", initials: "EC",
      decision: "Liberar", band: "go",
      traits: [
        { kind: "good", text: "Cadastro regular na Receita", icon: "check-circle" },
        { kind: "good", text: "Sócios sem restrições", icon: "shield-check" },
      ]
    };
    const ANALYSIS_STEPS = ["Consultando a Receita Federal", "Cruzando o quadro societário", "Lendo faturamento, pagamentos e sinais alternativos", "Aplicando o modelo RiskPlus"];
    const STEP_MS = 520;

    const SOURCES = ["Receita Federal", "Quadro societário", "Comportamento de faturamento", "Comportamento de pagamentos", "Sinais alternativos", "Modelo RiskPlus"];

    const STATEMENTS = [
      { us: <><b>Liberar, Atenção ou Negar.</b> Com os motivos ao lado.</>, them: "No bureau: score sem explicação." },
      { us: <>Analisa empresas <b>fora do bureau</b> usando sinais alternativos.</>, them: "No bureau: empresa nova ou pequena costuma aparecer como “sem informação”." },
      { us: <>Cola o CNPJ e <b>tem a resposta em segundos.</b></>, them: "No bureau: relatório longo pra interpretar." },
      { us: <><b>No painel ou via API</b>, do jeito que funcionar melhor pra você.</>, them: "No bureau: planilha ou integração antiga." },
    ];

    const FAQS = [
      { q: "Como a RiskPlus analisa empresas que não aparecem no bureau?",
        a: "A gente cruza os dados da Receita Federal e do quadro societário com o comportamento de faturamento e pagamentos e com sinais alternativos de fontes contratadas. Tudo passa pelo nosso modelo. Por isso MEI, empresa nova e pequeno negócio também recebem uma resposta." },
      { q: "De onde vêm os dados? Está de acordo com a LGPD?",
        a: "Usamos dados públicos, como Receita Federal e quadro societário, e dados de fontes contratadas. A RiskPlus é registrada como bureau, segue a LGPD e mantém base de exclusão para quem pedir." },
      { q: "Dá pra analisar vários CNPJs de uma vez ou integrar com meu sistema?",
        a: "Dá. No dia a dia, você cola o CNPJ no painel. Se tiver uma lista, manda pra gente que devolvemos a análise de todos em CSV. Também dá pra integrar via API." },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────
    const formatCnpj = (v) => {
      const d = v.replace(/\D/g, "").slice(0, 14);
      return d
        .replace(/^(\d{2})(\d)/, "$1.$2")
        .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1/$2")
        .replace(/(\d{4})(\d)/, "$1-$2");
    };
    const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const Icon = ({ n, b }) => <i className={`${b ? "ph-bold" : "ph"} ph-${n}`} aria-hidden="true"></i>;
    const Logo = () => (
      <>
        <img className="logo-light" src="assets/logo-blue.svg" alt="RiskPlus" />
        <img className="logo-dark" src="assets/logo-white.svg" alt="RiskPlus" />
      </>
    );

    // Fades [data-reveal] elements in once they enter the viewport.
    const useReveal = () => {
      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { e.target.dataset.shown = ""; io.unobserve(e.target); } });
        }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
        document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);
    };

    // ── Nav ───────────────────────────────────────────────────────────────────
    const NAV = [
      { href: "#diferenciais", label: "Diferenciais" },
      { href: "#como-funciona", label: "Como funciona" },
      { href: "#produto", label: "Produto" },
      { href: "#faq", label: "FAQ" },
    ];

    const Nav = () => {
      const [open, setOpen] = React.useState(false);
      const [active, setActive] = React.useState("");

      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) setActive("#" + e.target.id); });
        }, { rootMargin: "-45% 0px -50% 0px" });
        ["#hero", ...NAV.map((l) => l.href)].forEach((h) => { const el = document.querySelector(h); if (el) io.observe(el); });
        return () => io.disconnect();
      }, []);

      React.useEffect(() => {
        document.body.style.overflow = open ? "hidden" : "";
        const onKey = (e) => e.key === "Escape" && setOpen(false);
        window.addEventListener("keydown", onKey);
        return () => { document.body.style.overflow = ""; window.removeEventListener("keydown", onKey); };
      }, [open]);

      return (
        <>
          <header className="gnav">
            <div className="wrap">
              <a href="#" className="logo" aria-label="RiskPlus, início"><Logo /></a>
              <nav aria-label="Principal">
                {NAV.map((l) => <a key={l.href} href={l.href} className={active === l.href ? "active" : ""}>{l.label}</a>)}
              </nav>
              <div className="right">
                <a href="#acesso" className="pill pill-warn pill-sm">Falar com o time</a>
                <button className="icon-btn" aria-label="Abrir menu" aria-expanded={open} onClick={() => setOpen(true)}><Icon n="list" /></button>
              </div>
            </div>
          </header>
          <div className={`mmenu ${open ? "open" : ""}`} role="dialog" aria-modal="true" aria-label="Menu" aria-hidden={!open}>
            <div className="top"><button className="icon-btn" aria-label="Fechar menu" onClick={() => setOpen(false)}><Icon n="x" /></button></div>
            <nav>{NAV.map((l, i) => <a key={l.href} href={l.href} style={{ "--i": i }} onClick={() => setOpen(false)}>{l.label}</a>)}</nav>
            <a href="#acesso" className="pill pill-fill" onClick={() => setOpen(false)}>Falar com o time</a>
          </div>
        </>
      );
    };

    // ── Hero + live demo ──────────────────────────────────────────────────────
    const Hero = () => {
      const first = Object.keys(SAMPLES)[0];
      const [cnpj, setCnpj] = React.useState(first);
      const [phase, setPhase] = React.useState("analyzing");
      const [stepIdx, setStepIdx] = React.useState(0);
      const [result, setResult] = React.useState(null);
      const [shown, setShown] = React.useState(first);
      const timers = React.useRef([]);
      const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };

      const analisar = (raw, delay = 0) => {
        const key = raw ?? cnpj;
        clear();
        setPhase("analyzing"); setStepIdx(0);
        const sample = SAMPLES[key] || FALLBACK;
        ANALYSIS_STEPS.forEach((_, i) => timers.current.push(setTimeout(() => setStepIdx(i + 1), delay + (i + 1) * STEP_MS)));
        timers.current.push(setTimeout(() => { setResult(sample); setShown(key); setPhase("result"); }, delay + ANALYSIS_STEPS.length * STEP_MS + 260));
      };
      React.useEffect(() => { analisar(first, 1200); return clear; }, []);
      const busy = phase === "analyzing";

      // Start offsets for the pinned hero: text centered on top, demo centered
      // below it. The scroll animation carries both back to their grid cells.
      const heroRef = React.useRef(null), pinRef = React.useRef(null), textRef = React.useRef(null), demoRef = React.useRef(null);
      React.useEffect(() => {
        const measure = () => {
          const pin = pinRef.current, t = textRef.current, d = demoRef.current;
          const W = pin.clientWidth, top = 48, gap = 56;
          const vars = {
            "--tx": `${(W - t.offsetWidth) / 2 - t.offsetLeft}px`,
            "--ty": `${top - t.offsetTop}px`,
            "--dx": `${(W - d.offsetWidth) / 2 - d.offsetLeft}px`,
            "--dy": `${top + t.offsetHeight + gap - d.offsetTop}px`,
          };
          Object.entries(vars).forEach(([k, v]) => heroRef.current.style.setProperty(k, v));
        };
        measure();
        const ro = new ResizeObserver(measure);
        ro.observe(pinRef.current);
        ro.observe(textRef.current);
        ro.observe(demoRef.current);
        return () => ro.disconnect();
      }, []);

      return (
        <section className="hero tile" id="hero" ref={heroRef}>
          <div className="hero-pin" ref={pinRef}>
          <div className="hero-grid">
          <div className="hero-text" ref={textRef}>
            <h1 className="h-xl load" style={{ "--d": "100ms" }}>Saiba <span className="hl">em segundos</span> se vale vender a prazo.</h1>
            <p className="lead load" style={{ "--d": "260ms" }}>Cole o CNPJ do seu cliente B2B. A RiskPlus responde mesmo quando a empresa não tem histórico no bureau.</p>
            <div className="actions load" style={{ "--d": "400ms" }}>
              <a href="#acesso" className="pill pill-fill">Falar com o time</a>
              <a href="#como-funciona" className="more">Como funciona <Icon n="caret-right" b /></a>
            </div>
          </div>

          <div className="hero-demo" ref={demoRef}>
          <div className="load" style={{ "--d": "560ms" }}>
            <div>
              <div className="demo">
                <div className="demo-head">
                  <span>Análise de CNPJ</span>
                  <span className="ok"><Icon n="lock-simple" b />De acordo com a LGPD</span>
                </div>
                <div className="demo-row">
                  <input value={cnpj} placeholder="00.000.000/0000-00" inputMode="numeric" aria-label="CNPJ"
                    onChange={(e) => setCnpj(formatCnpj(e.target.value))}
                    onKeyDown={(e) => e.key === "Enter" && !busy && analisar()} />
                  <button onClick={() => analisar()} disabled={busy || cnpj.replace(/\D/g, "").length < 14}>
                    {busy ? "Analisando…" : <>Analisar <Icon n="arrow-right" /></>}
                  </button>
                </div>
                <div className="demo-ex" aria-label="CNPJs de exemplo">
                  {Object.keys(SAMPLES).map((k) => (
                    <button key={k} aria-pressed={shown === k && !busy} disabled={busy} onClick={() => { setCnpj(k); analisar(k); }}>{k}</button>
                  ))}
                </div>
                <div className="demo-stage" aria-live="polite">
                  {busy && (
                    <div className="skel">
                      {ANALYSIS_STEPS.map((s, i) => {
                        const st = i < stepIdx ? "done" : i === stepIdx ? "active" : "";
                        return (
                          <div key={i} className={`row ${st}`}>
                            <Icon n={st === "done" ? "check-circle" : st === "active" ? "circle-notch" : "circle"} b={st !== ""} />{s}
                          </div>
                        );
                      })}
                      <div className="bar w3"></div>
                      <div className="bar w1"></div>
                      <div className="bar w2"></div>
                    </div>
                  )}
                  {!busy && result && (
                    <div className={`res ${result.band}`}>
                      <div className="res-top">
                        <div className="res-av">{result.initials}</div>
                        <div>
                          <div className="res-co">{result.name}</div>
                          <div className="res-cnpj">CNPJ {shown}</div>
                        </div>
                      </div>
                      <div className="res-head-row">
                        <span className="res-k">Recomendação</span>
                        <span className={`res-decision tone-${result.band}`}>{result.decision}</span>
                      </div>
                      <span className="res-k">Motivos</span>
                      <div className="traits">
                        {result.traits.map((t, i) => <span key={i} className={`trait ${t.kind}`} style={{ "--i": i }}><Icon n={t.icon} b />{t.text}</span>)}
                      </div>
                      <div className="kv">
                        <div><div className="k">Setor</div><div className="v">{result.setor}</div></div>
                        <div><div className="k">Fundação</div><div className="v">{result.fundacao}</div></div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
          </div>
          </div>
          </div>
        </section>
      );
    };

    const Marquee = () => (
      <div className="marquee" aria-label="Fontes cruzadas em cada análise">
        <div className="track" aria-hidden="true">
          {[...SOURCES, ...SOURCES].map((s, i) => <span key={i}>{s}</span>)}
        </div>
      </div>
    );

    // ── Differentiators: each statement lights up as it crosses the middle ────
    const Differentiators = () => {
      const listRef = React.useRef(null);
      React.useEffect(() => {
        const items = listRef.current.querySelectorAll(".lit");
        if (reducedMotion()) { items.forEach((el) => (el.dataset.on = "")); return; }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) e.target.dataset.on = "";
            else if (e.boundingClientRect.top > window.innerHeight / 2) delete e.target.dataset.on;
          });
        }, { rootMargin: "-38% 0px -38% 0px" });
        items.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);

      return (
        <section className="sec" id="diferenciais">
          <div className="wrap center lit-head">
            <h2 className="h-lg" data-reveal>O bureau só enxerga quem já tem histórico de crédito.</h2>
            <p className="lead sub-c" data-reveal style={{ "--i": 1 }}>A RiskPlus cruza dados da Receita Federal e do quadro societário com o comportamento de faturamento e pagamentos e com sinais alternativos. Assim dá pra analisar MEI e empresa recém-aberta.</p>
          </div>
          <div className="wrap">
            <div className="lit-list" ref={listRef}>
              {STATEMENTS.map((s, i) => (
                <div className="lit" key={i}>
                  <h3>{s.us}</h3>
                  <p>{s.them}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ── How it works: horizontal gallery ──────────────────────────────────────
    const HowItWorks = () => {
      const galRef = React.useRef(null);
      const [ends, setEnds] = React.useState({ start: true, end: false });

      React.useEffect(() => {
        const gal = galRef.current;
        const cards = gal.querySelectorAll(".gcard");
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            const key = e.target === cards[0] ? "start" : "end";
            setEnds((s) => ({ ...s, [key]: e.intersectionRatio > 0.95 }));
          });
        }, { root: gal, threshold: [0, 0.5, 0.95, 1] });
        io.observe(cards[0]); io.observe(cards[cards.length - 1]);
        return () => io.disconnect();
      }, []);

      const go = (dir) => {
        const card = galRef.current.querySelector(".gcard");
        galRef.current.scrollBy({ left: dir * (card.offsetWidth + 20), behavior: reducedMotion() ? "auto" : "smooth" });
      };

      return (
        <section className="sec tile" id="como-funciona">
          <div className="wrap gal-head">
            <h2 className="h-lg" data-reveal>Do CNPJ à decisão em três passos.</h2>
            <div className="gal-nav">
              <button onClick={() => go(-1)} disabled={ends.start} aria-label="Passo anterior"><Icon n="caret-left" b /></button>
              <button onClick={() => go(1)} disabled={ends.end} aria-label="Próximo passo"><Icon n="caret-right" b /></button>
            </div>
          </div>
          <div className="gal" ref={galRef}>
            <article className="gcard">
              <span className="step">Primeiro</span>
              <h3>Cole o CNPJ.</h3>
              <p className="gtext">Qualquer empresa brasileira, com ou sem pontos e barra no número.</p>
              <div className="gvis"><div className="field-mock"><span>12.345.678/0001-90</span><span className="caret"></span></div></div>
            </article>
            <article className="gcard blue">
              <span className="step">Depois</span>
              <h3>A RiskPlus cruza os dados.</h3>
              <p className="gtext">Receita Federal, quadro societário, comportamento de faturamento e pagamentos e sinais alternativos passam pelo nosso modelo em segundos.</p>
              <div className="gvis"><div className="chips">{SOURCES.slice(0, 5).map((s) => <span key={s}>{s}</span>)}</div></div>
            </article>
            <article className="gcard">
              <span className="step">Por fim</span>
              <h3>Decida com os motivos na mão.</h3>
              <p className="gtext">Você recebe Liberar, Atenção ou Negar e os fatores que pesaram. Fica fácil explicar pro cliente ou pro sócio por que o prazo saiu ou não.</p>
              <div className="gvis"><div className="verdicts">
                <span className="go">Liberar <Icon n="check" b /></span>
                <span className="caution">Atenção <Icon n="warning" b /></span>
                <span className="stop">Negar <Icon n="x" b /></span>
              </div></div>
            </article>
          </div>
        </section>
      );
    };

    // ── Product (dark color block) ────────────────────────────────────────────
    const PRODUCT_FOR = [["check-circle", "Pagamentos em dia"], ["trend-up", "Faturamento estável"], ["shield-check", "Sócios sem restrições"], ["calendar-blank", "10 anos de Receita ativa"]];
    const PRODUCT_WATCH = [["clock", "1 atraso regularizado"]];
    const Product = () => (
      <section className="sec dark" id="produto">
        <div className="wrap center">
          <h2 className="h-lg" data-reveal>Uma resposta que você entende de primeira.</h2>
          <p className="lead sub-c" data-reveal style={{ "--i": 1 }}>A RiskPlus diz se vale vender a prazo e mostra o que pesou a favor e o que pesou contra.</p>
        </div>
        <div className="wrap">
          <div className="pcard" data-reveal style={{ "--i": 2 }}>
            <div className="pcard-top">
              <div className="av">MD</div>
              <div>
                <div className="who">Mercatto Distribuição Ltda, CNPJ 12.345.678/0001-90</div>
                <div className="arch go">Liberar</div>
                <p className="desc">Empresa com pagamentos em dia e faturamento estável. Sócios sem restrições e cadastro regular na Receita Federal.</p>
              </div>
              <span className="badge">Exemplo de análise</span>
            </div>
            <div className="pfactors">
              <div>
                <div className="k">A favor</div>
                <div className="traits">{PRODUCT_FOR.map(([ic, t]) => <span key={t} className="trait good"><Icon n={ic} b />{t}</span>)}</div>
              </div>
              <div>
                <div className="k">Ponto de atenção</div>
                <div className="traits">{PRODUCT_WATCH.map(([ic, t]) => <span key={t} className="trait neutral"><Icon n={ic} b />{t}</span>)}</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    );

    // ── The three decisions: bento ───────────────────────────────────────────
    const DECISIONS = [
      { cls: "go big", icon: "check-circle", name: "Liberar", desc: "Pode vender a prazo. Os sinais mostram uma empresa que paga em dia.",
        traits: ["Pagamentos em dia", "Faturamento estável ou crescente", "Sócios sem restrições", "Cadastro regular na Receita Federal"] },
      { cls: "caution", icon: "warning", name: "Atenção", desc: "Os sinais estão misturados. Vale olhar os motivos antes de decidir.",
        traits: ["Atrasos recentes em pagamentos", "Faturamento com oscilações"] },
      { cls: "stop", icon: "x-circle", name: "Negar", desc: "Os sinais de risco pesam mais. O mais seguro é vender à vista.",
        traits: ["Sócio com restrições em outros CNPJs", "Cadastro inconsistente na Receita Federal"] },
    ];
    const Decisions = () => (
      <section className="sec">
        <div className="wrap">
          <div className="center">
            <h2 className="h-lg" data-reveal>Três respostas possíveis.</h2>
            <p className="lead sub-c" data-reveal style={{ "--i": 1 }}>Cada CNPJ sai com uma recomendação clara e os fatores que levaram até ela.</p>
          </div>
          <div className="bento">
            {DECISIONS.map((d, i) => (
              <article key={d.name} className={`bt ${d.cls}`} data-reveal style={{ "--i": i }}>
                <span className="letter" aria-hidden="true"><Icon n={d.icon} b /></span>
                <span className="tag"><Icon n={d.icon} b />Recomendação</span>
                <h3>{d.name}</h3>
                <p className="bt-desc">{d.desc}</p>
                <div className="bt-k">Sinais que costumam levar aqui</div>
                <ul>{d.traits.map((t) => <li key={t}>{t}</li>)}</ul>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    // ── FAQ ───────────────────────────────────────────────────────────────────
    const FAQ = () => {
      const [open, setOpen] = React.useState(-1);
      return (
        <section className="sec tile" id="faq">
          <div className="wrap-narrow">
            <h2 className="h-lg center" data-reveal>Perguntas frequentes.</h2>
            <div className="faq">
              {FAQS.map((f, i) => (
                <div key={i} className={`qa ${open === i ? "open" : ""}`}>
                  <button onClick={() => setOpen(open === i ? -1 : i)} aria-expanded={open === i} aria-controls={`qa-${i}`}>
                    <span>{f.q}</span><Icon n="plus" />
                  </button>
                  <div className="a" id={`qa-${i}`} role="region"><div><p>{f.a}</p></div></div>
                </div>
              ))}
            </div>
            <p className="faq-note">Se sua dúvida não está aqui, <a href="#acesso">fale com o time</a>. A gente responde em até um dia útil.</p>
          </div>
        </section>
      );
    };

    // ── Access form ───────────────────────────────────────────────────────────
    const Access = () => {
      const [form, setForm] = React.useState({ nome: "", empresa: "", email: "", cnpj: "" });
      const [errors, setErrors] = React.useState({});
      const [sent, setSent] = React.useState(false);

      const handle = (e) => {
        const { name, value } = e.target;
        setForm({ ...form, [name]: name === "cnpj" ? formatCnpj(value) : value });
        if (errors[name]) setErrors({ ...errors, [name]: null });
      };
      const submit = (e) => {
        e.preventDefault();
        const err = {};
        if (!form.nome.trim()) err.nome = "Informe seu nome.";
        if (!form.empresa.trim()) err.empresa = "Informe a empresa.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) err.email = "Use um e-mail válido, ex.: nome@empresa.com.br";
        if (form.cnpj && form.cnpj.replace(/\D/g, "").length !== 14) err.cnpj = "O CNPJ tem 14 dígitos.";
        setErrors(err);
        if (!Object.keys(err).length) setSent(true);
      };
      const field = (name, label, props = {}, opt) => (
        <div className={`field ${errors[name] ? "err" : ""}`}>
          <label htmlFor={`f-${name}`}>{label}{opt && <span className="opt">opcional</span>}</label>
          <input id={`f-${name}`} name={name} value={form[name]} onChange={handle} aria-invalid={!!errors[name]} {...props} />
          {errors[name] && <span className="msg">{errors[name]}</span>}
        </div>
      );

      return (
        <section className="sec" id="acesso">
          <div className="wrap">
            <div className="access" data-reveal>
              <div>
                <h2 className="h-lg">Faça sua primeira consulta com a gente.</h2>
                <p className="lead">Deixe seu contato. O time faz uma consulta grátis com você e mostra como a RiskPlus funciona na sua operação.</p>
                <ul className="perks">
                  <li><Icon n="check-circle" />1 consulta grátis</li>
                  <li><Icon n="check-circle" />Sem fidelidade e sem taxa de setup</li>
                  <li><Icon n="check-circle" />Onboarding incluído</li>
                </ul>
              </div>
              <div className="form">
                {sent ? (
                  <div className="done">
                    <Icon n="check-circle" />
                    <h3>Recebemos seu contato.</h3>
                    <p>A gente fala com você pra marcar sua consulta grátis.</p>
                  </div>
                ) : (
                  <form onSubmit={submit} noValidate>
                    {field("nome", "Nome completo", { placeholder: "Marina Couto", autoComplete: "name" })}
                    {field("empresa", "Empresa", { placeholder: "Distribuidora Alvorada Ltda", autoComplete: "organization" })}
                    {field("email", "E-mail corporativo", { type: "email", placeholder: "marina@alvorada.com.br", autoComplete: "email" })}
                    {field("cnpj", "CNPJ da empresa", { placeholder: "00.000.000/0001-00", inputMode: "numeric" }, true)}
                    <button type="submit" className="pill pill-fill">Falar com o time</button>
                    <p className="fine">Respondemos em até um dia útil.</p>
                  </form>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ── Footer ────────────────────────────────────────────────────────────────
    const Footer = () => (
      <footer className="foot">
        <div className="wrap">
          <p className="note">A RiskPlus usa dados públicos e dados de fontes contratadas, de acordo com a LGPD. As decisões são recomendações. Em operação de valor alto, combine com a política de crédito da sua empresa.</p>
          <div className="cols">
            <div><h4>Produto</h4><a href="#produto">Análise de CNPJ</a><a href="#faq">Análise em lote</a><a href="#faq">API</a></div>
            <div><h4>Empresa</h4><a href="#">Sobre</a><a href="#acesso">Contato</a></div>
            <div><h4>Recursos</h4><a href="#faq">Central de ajuda</a><a href="#">Segurança e LGPD</a></div>
            <div><h4>Redes</h4><a href="#">LinkedIn</a><a href="#">X</a><a href="#">GitHub</a></div>
          </div>
          <div className="legal">
            <span>© 2026 RiskPlus Tecnologia Ltda. CNPJ 35.951.627/0001-02, São Paulo.</span>
            <nav aria-label="Legal"><a href="#">Privacidade</a><a href="#">Termos de uso</a></nav>
          </div>
        </div>
      </footer>
    );

    const App = () => {
      useReveal();
      return (
        <>
          <Nav />
          <main id="main">
            <Hero />
            <Marquee />
            <Differentiators />
            <HowItWorks />
            <Product />
            <Decisions />
            <FAQ />
            <Access />
          </main>
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
